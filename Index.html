main{

}
.winMsg{
    background-color: salmon;
    position: absolute;
    width: 100%;
    height: 64vh;

    color:yellow
}

    width: 100%;
    justify-content: center;
    display: inline-flex;
    background-color: aqua;

}

    width: 100%;
    display: flex;

    align-items: center;
    margin: 8vh 0;
}
.game{
    width: 30vw;
    height: 30vw;
    padding: 4px;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
}
.box{
    width: 33%;
    height: 33%;
    font-size: 16vmin;
    background-color: rgba(204, 148, 74, 0.856);
}

   display: flex;
   justify-content: center;

         </style>
    </head>
    <body>
        <main>
            <div class="headerText">
                <h1>Tic Tac Toe</h1>
            </div>
            
            <div class="container">
                
                <div class="game">
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                </div>
            
            </div>
            <div class="reset-btn">
                <button id="reset-btn">Created By:THE KRISHH</button>
            </div>
            
        </main>
        <script>
            let boxes=document.querySelectorAll('.box');
            let resetbtn=document.querySelector('#reset-btn');
            let container=document.getElementsByClassName('container');
            // let winMsg=`<div class="winMsg"><p>Hey! The Winner Is ${pos1}.</p></div>`;
            let isResultDec=false;
            
            resetbtn.addEventListener("click",resetfnctn);
            
            
            function resetfnctn(){
                turnO=true;
                resetbtn.innerText="Created By:THE KRISHH";   
                if(isResultDec){
                let winMsgAfter=document.querySelectorAll('div');
                winMsgAfter[1].remove()
               
                isResultDec=false;
                };
                for(let i of boxes){
                    i.disabled=false;
                    i.innerText='';
                };
                
            };
            
            
            let turnO=true;
            
            const winPatterns =[
                [0,1,2],
                [0,3,6],
                [0,4,8],
                [1,4,7],
                [2,5,8],
                [2,4,6],
                [3,4,5],
                [6,7,8],
            ];
            boxes.forEach( (box) => {
                
                box.addEventListener('click', () => {
                    resetbtn.innerText="Reset / New Game";
                    if (turnO){
                        box.setAttribute('style','color: blue');
                        box.innerText="O";
                        turnO=!turnO;
                        box.disabled=true;
                        checkWinner();
                    }else{
                        box.setAttribute('style','color: red');
                        box.innerText="X";
                        turnO=!turnO;
                        box.disabled=true;
                        checkWinner();
                    };
                    
                });
            });
            
            const checkWinner= () => {
                for(let pattern of winPatterns){
                    let pos1=boxes[pattern[0]].innerText;
                    let pos2=boxes[pattern[1]].innerText;
                    let pos3=boxes[pattern[2]].innerHTML;
                    if (pos1==="" || pos2==="" || pos3==="" ){
            
                    }else{
                    if(pos1===pos2 && pos2===pos3){
                        console.log('winner declared');
                        isResultDec=true;
                        if(turnO){
                            container[0].insertAdjacentHTML("beforebegin",`<div class="winMsg"><p>Hey! The Winner Is <winMsg style="color:red">${pos1}.</winMsg></p></div>`);
                        }else{
                            container[0].insertAdjacentHTML("beforebegin",`<div class="winMsg"><p>Hey! The Winner Is <winMsg style="color:blue">${pos1}.</winMsg></p></div>`);
                        };
                        for(let i of boxes){
                            i.disabled=true;
                        }
                    }else{
            
                    };  
                };
                };
            };
        </script>
    </body>
